<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>수학 도장노트</title>
  <meta name="description" content="수학 선생님들이 함께 쓰는 수업 도장 · 결석 · 포트폴리오 점수 · 최소 성취수준 보장지도 기록 앱">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="도장노트">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon-64.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Song+Myung&display=swap">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('ms:theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
  <script src="./config.js"></script>
</head>
<body>
  <div id="app"><div class="loading">불러오는 중…</div></div>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="shTitle">
      <div class="sh-head"><h2 id="shTitle"></h2><button class="x" type="button" data-act="closeSheet" aria-label="닫기">✕</button></div>
      <div class="sh-body" id="shBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
